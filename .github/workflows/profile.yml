name: Cynosure profile generator
on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"
  push:
    paths:
      - "tools/profile/*.py"
      - ".github/workflows/profile.yml"
permissions:
  contents: write
concurrency:
  group: cynosure-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch real GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/profile/fetch.py
      - name: Render animated data-driven SVG slices
        run: python tools/profile/render.py
      - name: Validate generated assets
        run: |
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          files=list(pathlib.Path('assets').glob('*.svg'))
          assert len(files)==15,len(files)
          for file in files: ET.parse(file)
          assert pathlib.Path('tools/profile/data/calendar.json').exists()
          assert pathlib.Path('tools/profile/data/stats.json').exists()
          print('Validated',len(files),'SVGs')
          PY
      - name: Publish with remote reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Big2What-Mods@users.noreply.github.com"
          git add assets tools/profile/data
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "Refresh Cynosure telemetry"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Published successfully."
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Remote changes conflict with generated files; refusing to overwrite."
              exit 1
            fi
            sleep 2
          done
          echo "Unable to publish after five attempts."
          exit 1
