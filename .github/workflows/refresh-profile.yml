name: Profile artwork protection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original artwork exists without modifying it
        run: |
          for file in header links stats contribution-city projects stack footer; do
            test -s "assets/$file.svg" || exit 1
          done
          echo "Artwork present. No files were modified."
