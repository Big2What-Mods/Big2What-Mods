name: Cynosure profile telemetry and renderer
on:
  workflow_dispatch:
  schedule:
    - cron: '19 10 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/*.py'
      - '.github/workflows/cynosure-profile.yml'
permissions:
  contents: write
concurrency:
  group: cynosure-profile-build
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch actual GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch.py
      - name: Render original animated Cynosure assets
        run: python tools/render.py
      - name: Rebuild README with cache-busting asset URLs
        run: python tools/readme.py
      - name: Validate SVG files and links
        run: |
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          assets=list(pathlib.Path('assets').glob('cynosure-*.svg'))
          assert len(assets)==15, f'Expected 15 SVGs, found {len(assets)}'
          for p in assets: ET.parse(p)
          r=pathlib.Path('README.md').read_text()
          assert r.count('<a href="https://github.com/Big2What-Mods/')==7
          assert 'Big2What' in r and 'BIG2WHAT' not in r
          print('VALIDATED',len(assets),'SVGs and seven project links')
          PY
      - name: Publish generated data and artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/cynosure-*.svg tools/profile-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate Cynosure terminal from verified GitHub data'
            git push
          fi