name: Cynosure Terminal telemetry
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update profile telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/profile/update.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/activity.svg assets/project-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Cynosure Terminal telemetry"
            git push
          fi
