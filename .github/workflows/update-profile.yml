name: Update Cynosure profile
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  push:
    branches: [main]
    paths:
      - "tools/profile/update.py"
      - ".github/workflows/update-profile.yml"
permissions:
  contents: write
concurrency:
  group: cynosure-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live GitHub data and render linked Cynosure modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/profile/update.py
      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Big2What-Mods@users.noreply.github.com"
          git add assets/header.svg assets/nexus.svg assets/stats.svg assets/activity.svg assets/projects.svg assets/project-*.svg assets/tech.svg assets/footer.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Cynosure live telemetry"
            git push
          fi
