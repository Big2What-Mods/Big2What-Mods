<svg xmlns="http://www.w3.org/2000/svg" width="960" height="120" viewBox="0 0 960 120"><style>
 @keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
 @keyframes scan{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}
 @keyframes type{from{width:0}to{width:100%}}
 .appear{animation:appear .55s ease both}.pulse{animation:pulse 2.5s infinite}
 .scan{animation:scan 12s linear infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style><defs><pattern id="hatch" width="13" height="16" patternUnits="userSpaceOnUse"><path d="M3 2h7v12H3z" fill="#59604d" stroke="#24291f"/></pattern></defs><rect x="12" y="0" width="936" height="108" fill="#fff8c6" stroke="#20251d" stroke-width="3"/><path d="M36 0V108M924 0V108" stroke="#4b5140" stroke-width="6"/><rect x="18" y="0" width="14" height="108" fill="url(#hatch)"/><rect x="928" y="0" width="14" height="108" fill="url(#hatch)"/><rect x="53" y="12" width="854" height="36" fill="#e5d89b" stroke="#20251d" stroke-width="1.5"/><text x="69" y="37" font-family="monospace" font-size="17" font-weight="700" fill="#20251d" >CYNOSURE SYSTEMS / SESSION STATUS</text><text x="79" y="101" font-family="monospace" font-size="17" font-weight="700" fill="#20251d" >ENCRYPTION MEASURES &amp; DEFENSIVE ICE</text><text x="728" y="101" font-family="monospace" font-size="15" font-weight="700" fill="#20251d" >LINK STABLE</text><circle cx="869" cy="95" r="8" fill="#e6bb51" class="pulse"/></svg>